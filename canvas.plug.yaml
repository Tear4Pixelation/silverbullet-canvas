name: canvas
version: 0.2.0
functions:
  canvasEditor:
    path: ./canvas.ts:canvasEditor
    editor: ["canvas"]

  canvasWidget:
    path: ./canvas.ts:showWidget
    codeWidget: canvas

  newCanvas:
    path: ./canvas.ts:newCanvas
    command:
      name: "Canvas: New"
      requireMode: rw

  embedCanvas:
    path: ./canvas.ts:embedCanvas
    command:
      name: "Canvas: Embed"
      requireMode: rw

  canvasSlashCommand:
    path: ./canvas.ts:insertNewCanvas
    slashCommand:
      name: canvas
      description: Create a canvas and embed a preview here

  canvasEmbedSlashCommand:
    path: ./canvas.ts:embedCanvas
    slashCommand:
      name: canvas-embed
      description: Embed a preview of an existing canvas

  canvasLinkSlashCommand:
    path: ./canvas.ts:linkNewCanvas
    slashCommand:
      name: canvas-link
      description: Create a canvas and link to it
