name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # Library installs (PLUG.md) fetch canvas.plug.js from the repo, so keep it current.
      # Pushes made with GITHUB_TOKEN don't trigger this workflow again.
      - name: Commit compiled plug
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canvas.plug.js
          git diff --cached --quiet || git commit -m "build: update compiled plug [skip ci]"
          git push

      - name: Move edge tag
        if: github.event_name != 'pull_request'
        run: |
          git tag -f edge
          git push -f origin edge

      - name: Publish edge release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge
          name: Edge build
          prerelease: true
          body: |
            Automated build from ${{ github.sha }}.

            Install in SilverBullet with `Library: Install` and the URI
            `https://github.com/${{ github.repository }}/blob/main/PLUG.md`.

            `canvas-editor.html` is the standalone editor: open it in a browser to edit `.canvas` files locally.
          files: |
            canvas.plug.js
            dist/canvas-editor.html
